<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Step Forward</title>
<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<style>
  body{margin:0;background:#000}
  #info{position:fixed;left:12px;bottom:12px;z-index:9;color:#cfd;font:13px/1.4 sans-serif;
        background:rgba(0,0,0,.55);padding:8px 10px;border-radius:6px;pointer-events:none}
</style>
</head>
<body>
<div id="info">Step Forward <span id="ver"></span> · klik = schieten · spatie = volgende plek · VR: trigger = schieten, A/X = volgende plek</div>

<a-scene renderer="colorManagement:true; antialias:true" background="color:#0b0d10"
         xr-mode-ui="enabled:true" vr-mode-ui="enabled:true" stad zombies>
  <a-entity id="rig">
    <a-entity id="cam" camera position="0 1.6 0" look-controls wasd-controls="enabled:false"></a-entity>
    <a-entity id="handL" laser-controls="hand:left; model:false" raycaster="objects:.raak; far:60; lineColor:#ff3a3a; lineOpacity:0.55"></a-entity>
    <a-entity id="handR" laser-controls="hand:right; model:false" raycaster="objects:.raak; far:60; lineColor:#ff3a3a; lineOpacity:0.55"></a-entity>
  </a-entity>
</a-scene>

<script>
/* ================= REGELKNOPPEN ================= */
const VERSIE  = 'v13';
const BOOG    = 180;   // hoeveel graden breed een panorama is (links-rechts)
const OOG     = 1.6;   // ooghoogte waarmee het plaatje is "gefotografeerd" (m)
const STRAAL  = 30;    // afstand van de gebogen wand (m)
const DOOF    = 0.45;  // seconden naar zwart en weer terug
const NAAMTIJD= 2.0;   // seconden dat de plaknaam in beeld staat
// horizon = op welke hoogte (0 = boven, 1 = onder) de horizon in het plaatje ligt
const PLEKKEN = [
  {naam:'PLEK A', src:'art/plek_a.jpg', horizon:0.525,
   // waar zombies vandaan komen: start (achter een muur of ver weg) en eventueel een tussenpunt (uit de deur / om de hoek)
   uitgangen:[
     {naam:'straat',      start:[0,26]},
     {naam:'straat L',    start:[-7,25]},
     {naam:'straat R',    start:[7,25]},
     {naam:'deur villa L',start:[-44,21], via:[-44,16]},
     {naam:'deur villa R',start:[43,21],  via:[43,16]},
     {naam:'hoek villa L',start:[-68,24], via:[-86,16]},
     {naam:'hoek villa R',start:[68,24],  via:[86,16]},
   ],
   // onzichtbare muren voor de gevels: wat erachter staat zie je niet (gat = deur)
   muren:[ {van:-80, tot:-48, r:19, h:12}, {van:-41, tot:-30, r:19, h:12},
           {van:30,  tot:39,  r:19, h:12}, {van:46.5, tot:78, r:19, h:12} ]},
  {naam:'PLEK B', src:'art/plek_b.jpg', horizon:0.495,
   uitgangen:[ {naam:'straat',start:[0,26]}, {naam:'straat L',start:[-6,25]}, {naam:'straat R',start:[6,25]},
     {naam:'deur huis L',start:[-51.5,20],via:[-51.5,14]}, {naam:'deur huis R',start:[48.5,20],via:[48.5,14]},
     {naam:'hoek huis L',start:[-70,24],via:[-87,15]}, {naam:'hoek huis R',start:[70,24],via:[87,15]} ],
   muren:[ {van:-82,tot:-54,r:17,h:12}, {van:-49,tot:-32,r:17,h:12}, {van:31,tot:46,r:17,h:12}, {van:51,tot:80,r:17,h:12} ]},
  {naam:'PLEK C', src:'art/plek_c.jpg', horizon:0.520,
   uitgangen:[ {naam:'straat',start:[0,26]}, {naam:'straat L',start:[-5,25]}, {naam:'straat R',start:[5,25]},
     {naam:'deur 1 L',start:[-45,20],via:[-45,14]}, {naam:'deur 2 L',start:[-38.5,20],via:[-38.5,14]},
     {naam:'deur R',start:[34.5,20],via:[34.5,14]},
     {naam:'poort L',start:[-80,24],via:[-80,14]}, {naam:'poort R',start:[59,24],via:[59,14]} ],
   muren:[ {van:-74,tot:-48,r:17,h:12}, {van:-42.5,tot:-41,r:17,h:12}, {van:-36,tot:-25,r:17,h:12},
           {van:18,tot:32.5,r:17,h:12}, {van:36,tot:50,r:17,h:12} ]},
  {naam:'PLEK D', src:'art/plek_d.jpg', horizon:0.530,
   uitgangen:[ {naam:'straat L',start:[-56,26]}, {naam:'steeg midden',start:[4,26]}, {naam:'straat R',start:[57,26]},
     {naam:'rolluik hoekpand',start:[-27,21],via:[-27,14]}, {naam:'deur hoekpand R',start:[22.5,21],via:[22.5,14]},
     {naam:'rolluik rij L',start:[-85,12],via:[-85,6]}, {naam:'deur rij R',start:[84,12],via:[84,6]} ],
   muren:[ {van:-90,tot:-87.5,r:9,h:9}, {van:-82.5,tot:-63,r:9,h:9}, {van:-50,tot:-30,r:17,h:14}, {van:-23,tot:-1,r:17,h:14},
           {van:10,tot:20.5,r:17,h:14}, {van:24.5,tot:55,r:17,h:14}, {van:62,tot:81,r:9,h:9}, {van:87,tot:90,r:9,h:9} ]},
  {naam:'PLEK E', src:'art/plek_e.jpg', horizon:0.605,
   uitgangen:[ {naam:'straat L',start:[-62,26]}, {naam:'straat R',start:[60,26]},
     {naam:'rolluik links',start:[-26,20],via:[-26,13]}, {naam:'rolluik voor',start:[6,20],via:[6,13]},
     {naam:'rolluik rij L',start:[-86,11],via:[-86,6]}, {naam:'rolluik rij R',start:[86,11],via:[86,6]} ],
   muren:[ {van:-90,tot:-89,r:8,h:9}, {van:-83,tot:-66,r:8,h:9}, {van:-40,tot:-29,r:16,h:12}, {van:-23,tot:2,r:16,h:12},
           {van:9.5,tot:23,r:16,h:12}, {van:66,tot:82.5,r:8,h:9}, {van:89,tot:90,r:8,h:9} ]},
];
/* ================================================ */
document.getElementById('ver').textContent = VERSIE;

AFRAME.registerComponent('stad', {
  init(){
    const T = THREE, sc = this.el.object3D, re = this.el.renderer;
    this.T = T;
    this.wereld = new T.Group(); sc.add(this.wereld);
    this.tex = PLEKKEN.map(p => {
      const t = new T.TextureLoader().load(p.src);
      t.colorSpace = T.SRGBColorSpace;
      t.anisotropy = re ? re.capabilities.getMaxAnisotropy() : 8;
      t.wrapS = t.wrapT = T.ClampToEdgeWrapping;
      return t;
    });
    this.mat = new T.MeshBasicMaterial({side:T.DoubleSide});
    this.wand = new T.Mesh(new T.BufferGeometry(), this.mat); this.wand.renderOrder = -3;
    this.vloerVer = new T.Mesh(new T.BufferGeometry(), this.mat); this.vloerVer.renderOrder = -3;
    this.muren = new T.Group();
    this.murenMat = new T.MeshBasicMaterial({colorWrite:false, side:T.DoubleSide});
    this.vmat = new T.MeshBasicMaterial({side:T.DoubleSide, transparent:true, vertexColors:true, depthWrite:false});
    this.vloer = new T.Mesh(new T.BufferGeometry(), this.vmat);
    this.vloer.renderOrder = 1;
    this.wereld.add(this.wand, this.vloer, this.vloerVer, this.muren);

    // donkere vloer achter je (daar is geen plaatje)
    const achter = new T.Mesh(new T.CircleGeometry(STRAAL, 48, Math.PI, Math.PI),
                     new T.MeshBasicMaterial({color:0x2a2b2e}));
    achter.rotation.x = -Math.PI/2; achter.position.y = -0.02;
    this.wereld.add(achter);
    // vloer bij je voeten: daar heeft het plaatje geen pixels meer → effen wegkleur
    this.voet = new T.Mesh(new T.CircleGeometry(1, 48), new T.MeshBasicMaterial({color:0x444444}));
    this.voet.rotation.x = -Math.PI/2; this.voet.position.y = -0.01;
    this.wereld.add(this.voet);

    // zwart doek om de camera (overgangen) — schrijft geen diepte (Cosmic-les)
    this.doek = new T.Mesh(new T.SphereGeometry(0.25, 16, 12),
      new T.MeshBasicMaterial({color:0, side:T.BackSide, transparent:true, opacity:1,
                               depthTest:false, depthWrite:false}));
    this.doek.renderOrder = 999;
    // plaknaam
    this.cv = document.createElement('canvas'); this.cv.width = 1024; this.cv.height = 256;
    this.naamTex = new T.CanvasTexture(this.cv); this.naamTex.colorSpace = T.SRGBColorSpace;
    this.naam = new T.Mesh(new T.PlaneGeometry(0.8, 0.2),
      new T.MeshBasicMaterial({map:this.naamTex, transparent:true, depthTest:false, depthWrite:false}));
    this.naam.position.set(0, 0, -0.2); this.naam.renderOrder = 1000;
    const cam = document.getElementById('cam');
    const hang = () => { cam.object3D.add(this.doek); cam.object3D.add(this.naam); };
    cam.hasLoaded ? hang() : cam.addEventListener('loaded', hang);

    // toestand op de spelklok (geen setTimeout)
    this.i = -1; this.doel = 0; this.fase = 'zwart'; this.dek = 1; this.naamT = 0;

    const volgende = () => { if (this.fase === 'open') { this.doel = (this.i+1) % PLEKKEN.length; this.fase = 'dicht'; } };
    ['handL','handR'].forEach(id => { const h = document.getElementById(id);
      h.addEventListener('abuttondown', volgende); h.addEventListener('xbuttondown', volgende); });
    window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowRight' || e.code === 'KeyN') volgende(); });
  },

  bouw(p){
    const T = this.T, VFOV = BOOG * 1536/2720;          // verticale graden van het plaatje
    const rad = Math.PI/180, hb = BOOG/2;
    const vVan = e => { const v = p.horizon - e/VFOV; return 1 - Math.min(1, Math.max(0, v)); };
    // --- gebogen wand: van vloerhoogte tot de bovenrand van het plaatje
    const eOnder = Math.atan2(-OOG, STRAAL)/rad, eBoven = Math.min(p.horizon*VFOV, 80);
    const NX = 128, NY = 64, pw = [], uw = [], iw = [];
    for (let j=0;j<=NY;j++){
      const e = eOnder + (eBoven-eOnder)*j/NY, y = OOG + STRAAL*Math.tan(e*rad);
      for (let i=0;i<=NX;i++){
        const f = -hb + BOOG*i/NX;
        pw.push(STRAAL*Math.sin(f*rad), y, -STRAAL*Math.cos(f*rad));
        uw.push(0.5 + f/BOOG, vVan(e));
      }
    }
    for (let j=0;j<NY;j++) for (let i=0;i<NX;i++){
      const a=j*(NX+1)+i, b=a+1, c=a+NX+1, d=c+1; iw.push(a,c,b, b,c,d);
    }
    this.zet(this.wand.geometry, pw, uw, iw);
    // --- vloer: elke vloerpunt pakt de pixel die je vanaf je ooghoogte zou zien
    // dichtstbij met beeld: onderrand van het plaatje
    const rRand = OOG/Math.tan((1-p.horizon)*VFOV*rad);
    const rMin = rRand*1.02, rVol = rRand*1.25;           // tussen rMin en rVol vervaagt de vloer
    const ring = (r0, r1, NR, alfa) => {
      const pv = [], uv = [], cv = [], iv = [];
      for (let j=0;j<=NR;j++){
        const t = j/NR, r = r0*Math.pow(r1/r0, t);          // dichter bij je fijner
        const e = -Math.atan2(OOG, r)/rad, al = Math.min(1, Math.max(0, (r-rMin)/(rVol-rMin)));
        for (let i=0;i<=NX;i++){
          const f = -hb + BOOG*i/NX;
          pv.push(r*Math.sin(f*rad), 0, -r*Math.cos(f*rad));
          uv.push(0.5 + f/BOOG, vVan(e));
          cv.push(1,1,1, al*al*(3-2*al));
        }
      }
      for (let j=0;j<NR;j++) for (let i=0;i<NX;i++){
        const a=j*(NX+1)+i, b=a+1, c=a+NX+1, d=c+1; iv.push(a,b,c, b,d,c);
      }
      return {pv, uv, cv, iv};
    };
    this.voet.scale.setScalar(rVol*1.05);
    const dicht = ring(rMin, rVol, 12), ver = ring(rVol, STRAAL, 56);
    this.zet(this.vloer.geometry, dicht.pv, dicht.uv, dicht.iv);
    this.vloer.geometry.setAttribute('color', new T.Float32BufferAttribute(dicht.cv, 4));
    this.zet(this.vloerVer.geometry, ver.pv, ver.uv, ver.iv);
    // onzichtbare muren van deze plek
    this.muren.children.slice().forEach(m => { m.geometry.dispose(); m.removeFromParent(); });
    (p.muren || []).forEach(m => {
      const g = new T.CylinderGeometry(m.r, m.r, m.h, 24, 1, true, Math.PI - m.tot*rad, (m.tot - m.van)*rad);
      const mesh = new T.Mesh(g, this.murenMat); mesh.position.y = m.h/2; mesh.renderOrder = -2;
      this.muren.add(mesh);
    });
  },
  wegKleur(img){     // gemiddelde kleur van de onderste strook van het plaatje
    const c = document.createElement('canvas'); c.width = 64; c.height = 8;
    const x = c.getContext('2d'); x.drawImage(img, 0, img.height*0.94, img.width, img.height*0.06, 0, 0, 64, 8);
    const d = x.getImageData(0,0,64,8).data; let r=0,g=0,b=0;
    for (let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; }
    const n = d.length/4;
    return new this.T.Color().setRGB(r/n/255, g/n/255, b/n/255, this.T.SRGBColorSpace);
  },
  zet(g, p, u, i){
    g.setAttribute('position', new this.T.Float32BufferAttribute(p, 3));
    g.setAttribute('uv', new this.T.Float32BufferAttribute(u, 2));
    g.setIndex(i); g.computeBoundingSphere();
  },
  toon(k){
    this.i = k; const p = PLEKKEN[k];
    this.mat.map = this.tex[k]; this.mat.needsUpdate = true;
    this.vmat.map = this.tex[k]; this.vmat.needsUpdate = true;
    this.voet.material.color.copy(this.wegKleur(this.tex[k].image));
    this.bouw(p);
    const c = this.cv.getContext('2d'); c.clearRect(0,0,1024,256);
    c.font = '700 120px Trebuchet MS, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineWidth = 14; c.strokeStyle = 'rgba(0,0,0,.9)'; c.strokeText(p.naam, 512, 128);
    c.fillStyle = '#e8f2ea'; c.fillText(p.naam, 512, 128);
    this.naamTex.needsUpdate = true; this.naamT = NAAMTIJD;
    this.el.emit('plekwissel', {plek:k});
  },
  tick(t, dt){
    const s = Math.min(dt/1000, 0.1);
    if (this.fase === 'dicht'){ this.dek = Math.min(1, this.dek + s/DOOF); if (this.dek >= 1) this.fase = 'zwart'; }
    else if (this.fase === 'zwart'){
      const tx = this.tex[this.doel];
      if (tx.image && tx.image.complete !== false && tx.image.width){ this.toon(this.doel); this.fase = 'op'; }
    }
    else if (this.fase === 'op'){ this.dek = Math.max(0, this.dek - s/DOOF); if (this.dek <= 0) this.fase = 'open'; }
    this.doek.material.opacity = this.dek; this.doek.visible = this.dek > 0.001;
    if (this.naamT > 0) this.naamT -= s;
    this.naam.material.opacity = Math.max(0, Math.min(1, this.naamT/0.5));
    this.naam.visible = this.naamT > 0;
  }
});
</script>
<script>
/* ================= ZOMBIES — REGELKNOPPEN ================= */
const ZOMBIE_SOORTEN = [1, 3, 4, 5, 6, 7, 8];     // welke zN.json in art/zombies staan
const ZLENGTE   = 1.72;   // hoe lang een zombie is (m)
const ZTEGELIJK = 9;      // maximaal zoveel tegelijk in beeld
const ZAFSTAND  = [15, 24];  // waar ze verschijnen (m vóór je)
const ZHOEK     = 38;     // hoe ver links/rechts ze mogen verschijnen (graden)
const ZSNEL     = [0.45, 0.9]; // loopsnelheid (m/s)
const RENNERS   = 0.25;   // kans dat een zombie een renner is
const RENSNEL   = [1.5, 2.2];  // snelheid van een renner (m/s)
const ARM_HOEK  = 14;     // armen hangen zoveel graden van het lijf af (plaatjes met wijde armen worden bijgedraaid)
const ZSTOP     = 1.3;    // hier blijven ze staan (m van je af)
const ZPAUZE    = [0.3, 1.3];  // tijd tussen twee nieuwe zombies (s)
const ROMPHP    = 5;      // treffers op borst/buik voor hij omvalt
const DEELHP    = {hand:1, voet:1, onderarm:2, onderbeen:2, bovenarm:3, bovenbeen:3}; // treffers voor het eraf gaat
const HOOFD_DEEL  = 0.20;        // kans dat een hoofdtreffer maar één kwart wegschiet (anders: hele hoofd eraf)
const SCHEDEL_LOOP = [2.5, 4.5]; // met een kwart minder loopt hij nog zo lang door (s)
const SCHEDEL_SNEL = 1.0;        // ...op deze fractie van zijn snelheid
const KNIEVAL    = 0.5;   // kans dat hij eerst door zijn knieën zakt voor hij achterover valt
const RICHT_OMLAAG = 45;  // richtstraal (en dus de kogel) zoveel graden onder de lengteas van de controller — precies zoals in Cosmic
const SCHOK      = 0.75;  // hoe hard een geraakt lichaamsdeel terugklapt (radialen)
const SCHEDEL_DWAAL = 55;        // ...en hij dwaalt zoveel graden links/rechts van je af (doelloos)
const KRUIP_SNEL = 0.22;  // kruipsnelheid zonder (heel) been (m/s)
const KRUIP_HOEK = 28;    // hoe ver hij voorover helt bij het kruipen (graden)
const KRUIP_LAAG = 0.85;  // zoveel van zijn heuphoogte zakt hij de grond in (onder de straat wordt weggeknipt)
const ZWAARTE   = 9.8;
const LIJK_TIJD = 6;      // zolang blijft een lijk/stuk liggen voor het wegzakt (s)
const BLOED_N   = 600;    // bloeddruppels in de pool
const PLAS_N    = 260;    // bloedvlekken op de grond
/* ========================================================== */
AFRAME.registerComponent('zombies', {
  init(){
    const T = THREE; this.T = T;
    this.sc = this.el.object3D;
    this.wortel = document.createElement('a-entity'); this.wortel.classList.add('raak');
    this.el.appendChild(this.wortel);
    this.soorten = {}; this.lijst = []; this.los = []; this.wacht = 2; this.klaar = false;
    this.rc = new T.Raycaster(); this.rc.far = 80;
    this.el.renderer.localClippingEnabled = true;                 // niets van een zombie onder de straat
    this.klip = [new T.Plane(new T.Vector3(0,1,0), 0)];
    this.laad().then(() => { this.klaar = true; });
    // bloed
    const bg = new T.BufferGeometry();
    this.bPos = new Float32Array(BLOED_N*3); this.bVel = new Float32Array(BLOED_N*3); this.bLeef = new Float32Array(BLOED_N);
    for (let i=0;i<BLOED_N;i++) this.bPos[i*3+1] = -50;
    bg.setAttribute('position', new T.BufferAttribute(this.bPos, 3));
    this.bloed = new T.Points(bg, new T.PointsMaterial({color:0x8a0606, size:0.035, sizeAttenuation:true}));
    this.bloed.frustumCulled = false; this.sc.add(this.bloed); this.bI = 0;
    // bloedvlekken op de grond
    const vc = document.createElement('canvas'); vc.width = vc.height = 128; const x = vc.getContext('2d');
    for (let k=0;k<14;k++){ const r = 10+Math.random()*30, a = Math.random()*6.28, d = Math.random()*30;
      x.fillStyle = `rgba(${90+Math.random()*40|0},0,0,${0.6+Math.random()*0.4})`;
      x.beginPath(); x.arc(64+Math.cos(a)*d, 64+Math.sin(a)*d, r, 0, 6.28); x.fill(); }
    const vt = new T.CanvasTexture(vc); vt.colorSpace = T.SRGBColorSpace;
    this.plas = new T.InstancedMesh(new T.PlaneGeometry(1,1).rotateX(-Math.PI/2),
      new T.MeshBasicMaterial({map:vt, color:0x7a2020, transparent:true, depthWrite:false}), PLAS_N);
    this.plas.count = 0; this.plas.renderOrder = 2; this.plas.frustumCulled = false; this.sc.add(this.plas); this.pI = 0;
    // stomp-textuur (rood rafelrondje)
    const sc2 = document.createElement('canvas'); sc2.width = sc2.height = 64; const y = sc2.getContext('2d');
    for (let k=0;k<9;k++){ y.fillStyle = k<5 ? '#5a0000' : '#a8121a';
      y.beginPath(); y.arc(32+(Math.random()-0.5)*16, 32+(Math.random()-0.5)*16, 12-k*0.6+Math.random()*6, 0, 6.28); y.fill(); }
    this.stompTex = new T.CanvasTexture(sc2); this.stompTex.colorSpace = T.SRGBColorSpace;
    this.stompMat = new T.MeshBasicMaterial({map:this.stompTex, alphaTest:0.4, clippingPlanes:this.klip});
    // invoer
    ['handL','handR'].forEach(id => document.getElementById(id).addEventListener('triggerdown', () => this.schiet(id)));
    const muis = e => { if (e.button === 0) this.schiet('muis', e); };
    this.el.canvas ? this.el.canvas.addEventListener('mousedown', muis)
                   : this.el.addEventListener('render-target-loaded', () => this.el.canvas.addEventListener('mousedown', muis));
    this.el.addEventListener('plekwissel', () => this.leeg());
    this.wapens = {};
    this.spuiters = [];
    // rode nevel bij een afgeschoten deel
    const nc = document.createElement('canvas'); nc.width = nc.height = 64; const nx = nc.getContext('2d');
    const gr = nx.createRadialGradient(32,32,2,32,32,32); gr.addColorStop(0,'rgba(150,0,0,0.9)'); gr.addColorStop(0.5,'rgba(110,0,0,0.5)'); gr.addColorStop(1,'rgba(80,0,0,0)');
    nx.fillStyle = gr; nx.fillRect(0,0,64,64);
    const nt = new T.CanvasTexture(nc); nt.colorSpace = T.SRGBColorSpace;
    this.nevels = []; for (let i=0;i<12;i++){
      const sp = new T.Sprite(new T.SpriteMaterial({map:nt, transparent:true, depthWrite:false, opacity:0}));
      sp.visible = false; sp.userData = {t:0, maat:0.5}; this.sc.add(sp); this.nevels.push(sp); }
    this.nI = 0;
  },
  schok(kn, kracht){

  /* ---------- een zombie in elkaar zetten ---------- */
  maak(n){
    const T = this.T, so = this.soorten[n], j = so.j, s = so.s, W = j.maat[0], H = j.maat[1];
    const loc = (px,py) => new T.Vector3((px - W/2)*s, (H - py)*s, 0);
    const z = {n, grp:new T.Group(), knoop:{}, hp:ROMPHP, dood:false, val:0, t:Math.random()*10,
               snel: Math.random() < RENNERS ? RENSNEL[0] + Math.random()*(RENSNEL[1]-RENSNEL[0])
                                             : ZSNEL[0] + Math.random()*(ZSNEL[1]-ZSNEL[0]), weg:0, benen:2};
    const volgorde = []; const bezocht = new Set();
    const zet = d => { if (bezocht.has(d) || !so.delen[d]) return; const o = so.delen[d].info.ouder; if (o) zet(o); bezocht.add(d); volgorde.push(d); };
    Object.keys(so.delen).forEach(zet);

      m.userData = {z, deel:d, D};

    });

      const sch = so.delen['bovenarm'+k], hd = so.delen['hand'+k];

  nieuw(){

  /* ---------- schieten ---------- */

  raak(z, deel, p, dir){
    this.spat(p, dir, 26);
    if (deel === 'borst' || deel === 'buik'){
      if (z.dood) return;
      this.schok(z.knoop[deel], 0.45);
      z.hp--; this.spat(p, dir, 30);
      if (z.hp <= 0) this.omver(z);
      return;
    }
    if (deel.startsWith('hoofd')){
      const over = ['hoofd1','hoofd2','hoofd3','hoofd4'].filter(d => z.knoop[d] && !z.knoop[d].userData.los);
      if (!z.dood && !z.halfdood && over.length === 4 && Math.random() < HOOFD_DEEL){
        // 20%: één willekeurig kwart weg (een gat in zijn kop) — hij zwalkt nog even door met een fontein
        const d = over[Math.random()*4|0], b = z.knoop.borst, m = z.knoop[d].children.find(c => c.isMesh);
        if (b && m){ const w = new THREE.Vector3(); m.getWorldPosition(w); z.fonteinLok = b.worldToLocal(w); }
        this.losMaak(z, d, dir, 1.4); this.spat(p, dir, 60);
        z.halfdood = SCHEDEL_LOOP[0] + Math.random()*(SCHEDEL_LOOP[1]-SCHEDEL_LOOP[0]);
        z.snel *= SCHEDEL_SNEL;
      } else {
        // 80% (en elke volgende treffer): het hele hoofd spat uiteen
        over.forEach(d => this.losMaak(z, d, dir, 1.6)); this.spat(p, dir, 90);
        z.halfdood = 0; this.omver(z);
      }
      return;
    }
    const kn = z.knoop[deel]; if (!kn || kn.userData.los) return;
    const soort = deel.replace(/[LR]$/, '');
    z.deelHp = z.deelHp || {};
    if (z.deelHp[deel] === undefined) z.deelHp[deel] = DEELHP[soort] || 1;
    if (--z.deelHp[deel] > 0){ this.spat(p, dir, 20); this.schok(kn, 1); return; }
    this.losMaak(z, deel, dir, 1);
    if (/been|voet/.test(deel) && !z.dood) z.kruip = true;   // been kwijt → voorover en kruipen
  },
  losMaak(z, deel, dir, kracht){
    const T = this.T, kn = z.knoop[deel]; if (!kn || !kn.parent || kn.userData.los) return;
    const ouder = kn.parent;

      st.position.copy(kn.position); st.position.z = 0.03; st.scale.set(1+Math.random()*0.5, 0.7+Math.random()*0.5, 1);
      ouder.add(st);
    }
    const wp = new T.Vector3(); kn.getWorldPosition(wp);
    this.sc.attach(kn); kn.userData.los = true;
    const v = new T.Vector3(dir.x, 0, dir.z).normalize().multiplyScalar((1.5+Math.random()*2.5)*kracht);
    v.x += (Math.random()-0.5)*2.5*kracht; v.y = (2.5+Math.random()*2.5)*kracht;
    this.los.push({o:kn, v, w:new T.Vector3((Math.random()-0.5)*8, (Math.random()-0.5)*8, (Math.random()-0.5)*14), t:0, grond:false});
    this.spat(wp, dir, 80);
    this.nevel(wp, deel.startsWith('hoofd') ? 0.9 : 0.6);
    if (ouder !== z.grp && !deel.startsWith('hoofd'))
      this.spuiters.push({b:ouder, lok:kn.position.clone(), uit:kn.userData.uit.clone().normalize(), t:1.3});
  },
  omver(z){
    if (z.dood) return; z.dood = true; z.val = 0;
    z.valKant = Math.random() < 0.5 ? -1 : 1;
    z.knieval = !z.kruip && Math.random() < KNIEVAL;
  },
  /* ---------- bloed ---------- */
  fontein(p, n){
    for (let k=0;k<n;k++){
      const i = this.bI; this.bI = (this.bI+1) % BLOED_N;
      this.bPos[i*3] = p.x; this.bPos[i*3+1] = p.y; this.bPos[i*3+2] = p.z;
      this.bVel[i*3] = (Math.random()-0.5)*0.9; this.bVel[i*3+1] = 2.2+Math.random()*1.8; this.bVel[i*3+2] = (Math.random()-0.5)*0.9;
      this.bLeef[i] = 2;
    }
  },
  spat(p, dir, n){
    for (let k=0;k<n;k++){
      const i = this.bI; this.bI = (this.bI+1) % BLOED_N;
      this.bPos[i*3] = p.x; this.bPos[i*3+1] = p.y; this.bPos[i*3+2] = p.z;
      const sp = 1 + Math.random()*3;
      this.bVel[i*3]   = dir.x*sp*0.8 + (Math.random()-0.5)*2.2;
      this.bVel[i*3+1] = Math.random()*2.8;
      this.bVel[i*3+2] = dir.z*sp*0.8 + (Math.random()-0.5)*2.2;
      this.bLeef[i] = 2.5;
    }
  },
  vlek(x, z, maat){
    const T = this.T, m = new T.Matrix4(), i = this.pI; this.pI = (this.pI+1) % PLAS_N;
    m.compose(new T.Vector3(x, 0.004 + i*0.00002, z), new T.Quaternion().setFromAxisAngle(new T.Vector3(0,1,0), Math.random()*6.28),

  },
  /* ---------- geluid ---------- */
  knal(){   // harde klap: tik + scherpe knal + dreun + galm, door een compressor zodat het hard is zonder te kraken
    try {
      const A = this.ac || (this.ac = new (window.AudioContext||window.webkitAudioContext)());
      if (A.state === 'suspended') A.resume();
      const nu = A.currentTime, sr = A.sampleRate;
      if (!this.uit){
        const c = A.createDynamicsCompressor(); c.threshold.value = -14; c.knee.value = 6; c.ratio.value = 8;
        c.attack.value = 0.001; c.release.value = 0.12;
        const g = A.createGain(); g.gain.value = 1.6; c.connect(g).connect(A.destination); this.uit = c;
        const ruis = (dur, macht) => { const n = sr*dur|0, b = A.createBuffer(1, n, sr), d = b.getChannelData(0);
          for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, macht); return b; };
        this.bKnal = ruis(0.09, 6); this.bGalm = ruis(0.6, 3);
      }
      const bron = (buf, type, f, vol, t0=0) => { const s = A.createBufferSource(); s.buffer = buf;
        const fl = A.createBiquadFilter(); fl.type = type; fl.frequency.value = f;
        const g = A.createGain(); g.gain.value = vol; s.connect(fl).connect(g).connect(this.uit); s.start(nu+t0); };
      bron(this.bKnal, 'highpass', 900, 1.4);          // de scherpe knal
      bron(this.bKnal, 'lowpass', 2500, 1.2);          // het lijf van de knal
      bron(this.bGalm, 'lowpass', 700, 0.45, 0.01);   // galm tussen de huizen

      og.gain.setValueAtTime(1.3, nu); og.gain.exponentialRampToValueAtTime(0.001, nu+0.22);

  },
  /* ---------- elke beurt ---------- */
  tick(t, dt){
    const s = Math.min(dt/1000, 0.05), T = this.T, cam = this.el.camera;
    this.wapenTick(s);
    if (!this.klaar) return;
    const ik = new T.Vector3(); cam.getWorldPosition(ik); ik.y = 0;
    // nieuwe zombies
    const levend = this.lijst.filter(z => !z.dood).length;
    this.wacht -= s;
    if (this.wacht <= 0 && levend < ZTEGELIJK){ this.nieuw(); this.wacht = ZPAUZE[0] + Math.random()*(ZPAUZE[1]-ZPAUZE[0]); }
    // lopen / waggelen / omvallen
    for (const z of this.lijst){
      const g = z.grp; z.t += s;
      const naar = ik.clone().sub(g.position); naar.y = 0; const afst = naar.length();
      if (!z.dood){
        g.rotation.y = Math.atan2(naar.x, naar.z);
        const v = z.kruip ? KRUIP_SNEL : z.snel;
        if (z.via){   // eerst de deur uit / om de hoek
          const nv = z.via.clone().sub(g.position); nv.y = 0;
          if (nv.length() < 0.6) z.via = null;
          else { g.position.addScaledVector(nv.normalize(), v*s); naar.set(0,0,0); }
        }
        if (!z.via && afst > ZSTOP){
          naar.normalize();
          if (z.halfdood){   // zonder schedeldak: zelfde tempo, maar zwalkt doelloos heen en weer
            const zw = (Math.sin(z.t*0.7 + z.n*1.3)*0.75 + Math.sin(z.t*1.9)*0.25) * SCHEDEL_DWAAL*Math.PI/180;
            naar.applyAxisAngle(new T.Vector3(0,1,0), zw);
          }
          g.position.addScaledVector(naar, v*s);
        }
        const f = z.t * (2.2 + v*2);
        if (z.kruip){
          g.rotation.x += (KRUIP_HOEK*Math.PI/180 - g.rotation.x)*Math.min(1, s*4);
          g.rotation.z = Math.sin(f*0.8)*0.10;
          g.position.y += (-z.heup*KRUIP_LAAG - g.position.y)*Math.min(1, s*4);
        } else {
          g.rotation.z = Math.sin(f)*0.06;
          g.position.y = Math.abs(Math.sin(f))*0.03;
        }
        const k = z.knoop;
        if (k.bovenbeenL) k.bovenbeenL.rotation.z =  Math.sin(f)*0.08;
        if (k.bovenbeenR) k.bovenbeenR.rotation.z =  Math.sin(f)*0.08;
        const ak = z.kruip ? 0.45 : 0.10;    // kruipend trekt hij zich op zijn armen vooruit
        if (k.bovenarmL && !k.bovenarmL.userData.los) k.bovenarmL.rotation.z = z.rust.L + Math.sin(f*0.7)*ak;
        if (k.bovenarmR && !k.bovenarmR.userData.los) k.bovenarmR.rotation.z = z.rust.R - Math.sin(f*0.7+1)*ak;
        if (k.borst) k.borst.rotation.z = Math.sin(f+0.5)*0.04;
        for (const d in k){   // terugslag: het geraakte deel klapt van je af en veert terug
          const u = k[d].userData, bin = u.bin; if (!bin || u.los) continue;
          if (u.schok > 0.001){
            u.schok = Math.max(0, u.schok - s*4.5);
            const w = u.schok*u.schok*SCHOK*(1 + 0.25*Math.sin(z.t*40));
            bin.quaternion.identity();
            if (d === 'borst' || d === 'buik') bin.rotateX(-w*0.35);           // romp: klapt achterover
            else if (u.uit.lengthSq() > 1e-6){                                 // ledemaat: uiteinde van je af
              const as = u.uit.clone().normalize().cross(new T.Vector3(0,0,-1)).normalize();
              bin.rotateOnAxis(as, w);
            }
          } else if (u.schok === 0 && !bin.quaternion.equals(new T.Quaternion())) bin.quaternion.identity();

          z.halfdood -= s;
          const b = z.knoop.borst;
          if (b && z.fonteinLok){   // fontein uit het gat in zijn kop
            const w = z.fonteinLok.clone(); w.z += 0.03; b.localToWorld(w);
            this.fontein(w, 5);
          }
          g.rotation.z += Math.sin(z.t*5.3)*0.05;     // strompelen
          if (z.halfdood <= 0){ z.halfdood = 0; this.omver(z); }
        }
      } else {
        z.val += s;
        const a = Math.min(1, z.val/0.7);
        if (z.kruip) g.rotation.x += (0.9 - g.rotation.x)*Math.min(1, s*5);   // kruiper zakt voorover in elkaar
        else if (z.knieval){
          // 1) door de knieën zakken  2) even op de knieën wankelen  3) achterover
          const ZAK = 0.28, WACHT = 0.55, OM = 0.75;
          if (z.val < ZAK){ const b = z.val/ZAK; g.position.y = -z.knie*b*b; g.rotation.x = 0.12*b; }
          else if (z.val < ZAK+WACHT){ g.position.y = -z.knie; g.rotation.x = 0.12 + Math.sin((z.val-ZAK)*9)*0.04; }
          else { const b = Math.min(1, (z.val-ZAK-WACHT)/OM);
                 g.rotation.x = 0.12 - b*b*(Math.PI/2*0.96 + 0.12); g.position.y = -z.knie*(1-b); }
        }
        else { g.rotation.x = -a*a*Math.PI/2*0.96; g.position.y = Math.max(0, g.position.y - s); }   // achterover
        g.rotation.z += (z.valKant*0.25 - g.rotation.z)*s*3;
        if (z.val > (z.knieval ? 1.6 : 0.7) && !z.plas){ z.plas = true; this.vlek(g.position.x, g.position.z, 1.2+Math.random()*0.8); }
        if (z.val > LIJK_TIJD) g.position.y -= s*0.25;        // wegzakken
      }
    }
    this.lijst = this.lijst.filter(z => { if (z.dood && z.val > LIJK_TIJD+3){ z.grp.removeFromParent(); return false; } return true; });
    // losse stukken
    for (const l of this.los){
      l.t += s; const o = l.o;
      if (!l.grond){
        l.v.y -= ZWAARTE*s; o.position.addScaledVector(l.v, s);
        o.rotation.x += l.w.x*s; o.rotation.y += l.w.y*s; o.rotation.z += l.w.z*s;
        if (o.position.y < 0.05 && l.v.y < 0){
          if (Math.abs(l.v.y) > 2.5){ l.v.y *= -0.3; l.v.x *= 0.5; l.v.z *= 0.5; l.w.multiplyScalar(0.5); }
          else { l.grond = true; o.position.y = 0.05; o.rotation.x = -Math.PI/2; o.rotation.y = 0; this.vlek(o.position.x, o.position.z, 0.35+Math.random()*0.3); }
        }
      } else if (l.t > LIJK_TIJD) o.position.y -= s*0.06;
    }
    this.los = this.los.filter(l => { if (l.t > LIJK_TIJD+4){ l.o.removeFromParent(); return false; } return true; });
    // bloed
    for (let i=0;i<BLOED_N;i++){
      if (this.bLeef[i] <= 0) continue;
      this.bLeef[i] -= s; const j = i*3;
      this.bVel[j+1] -= ZWAARTE*s;
      this.bPos[j] += this.bVel[j]*s; this.bPos[j+1] += this.bVel[j+1]*s; this.bPos[j+2] += this.bVel[j+2]*s;
      if (this.bPos[j+1] <= 0.01){
        if (Math.random() < 0.08) this.vlek(this.bPos[j], this.bPos[j+2], 0.08+Math.random()*0.15);
        this.bLeef[i] = 0; this.bPos[j+1] = -50;
      }
      if (this.bLeef[i] <= 0) this.bPos[j+1] = -50;
    }
    this.bloed.geometry.attributes.position.needsUpdate = true;
    // spuitende stompen
    for (const sp of this.spuiters){
      sp.t -= s; if (sp.t <= 0 || !sp.b.parent) continue;
      const p = sp.lok.clone(); sp.b.localToWorld(p);
      const r = sp.uit.clone().transformDirection(sp.b.matrixWorld);
      for (let k=0;k<3;k++){
        const i = this.bI; this.bI = (this.bI+1) % BLOED_N; const kr = (1.2 + Math.random()*1.6) * Math.min(1, sp.t*1.2);
        this.bPos[i*3] = p.x; this.bPos[i*3+1] = p.y; this.bPos[i*3+2] = p.z;
        this.bVel[i*3] = r.x*kr + (Math.random()-0.5)*0.5; this.bVel[i*3+1] = r.y*kr + 0.8 + Math.random()*0.6; this.bVel[i*3+2] = r.z*kr + (Math.random()-0.5)*0.5;
        this.bLeef[i] = 2;
      }
    }
    this.spuiters = this.spuiters.filter(sp => sp.t > 0);
    // rode nevel
    for (const n of this.nevels){
      if (!n.visible) continue; n.userData.t -= s;
      const a = Math.max(0, n.userData.t/0.4); n.material.opacity = 0.85*a;
      n.scale.setScalar(n.userData.maat*(0.25 + (1-a)*1.1));
      if (a <= 0) n.visible = false;
    }
  }
});
</script>
